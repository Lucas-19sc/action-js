name: "inclui comentario"
description: "Inclui um comentário em uma issue ou pull request"
author: "Lucas Cardoso"
inputs: 
  GITHUB_TOKEN:
    description: "Token do GitHub para autenticação"
    required: true
  issue_id:
    description: "ID da issue ou pull request onde o comentário será adicionado"
    required: true
  comment:
      description: "O comentário que será adicionado à issue ou pull request"
      required: true

outputs:
   comment-id:
     description: "id do comentarios"
runs:
  using: "node24"
  main: "dist/index.js"
